name: Link Check

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9am UTC
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Root-relative /docs/* links can't resolve against local files
          # (content/foo.mdx serves /docs/foo), so resolve them against the live
          # site with --base-url.
          #
          # This used --remap alone and failed every run, including before the
          # docs overhaul, with:
          #
          #   Cannot resolve root-relative link '/docs/academy/glossary':
          #   To resolve root-relative links in local files, provide a root dir
          #
          # --remap rewrites a URI, and a bare "/docs/x" never becomes one: it
          # fails to parse before remap can touch it. --base-url is the flag that
          # gives a root-relative path something to be relative TO. A weekly gate
          # that errors on config checks nothing and says so in a way that reads
          # like broken content.
          #
          # The advizr.ca exclude is anchored so it no longer swallows docs.advizr.ca.
          args: >-
            --verbose
            --no-progress
            --accept 200..=299
            --exclude-path node_modules
            --exclude-path .next
            --exclude-path package-lock.json
            --base-url https://docs.advizr.ca
            --exclude '^https?://(www\.)?advizr\.ca'
            --exclude 'advizrclients\.com'
            --exclude 'localhost'
            'content/**/*.mdx'
            'content/**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create issue on failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'Link check: broken links detected'
          content-filepath: ./lychee/out.md
          labels: 'bug,documentation'
